[project]
name = "datahub-document-enrichment"
version = "0.1.0"
description = "Review-first DataHub document enrichment MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
datahub = ["acryl-datahub==1.6.0.15"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
